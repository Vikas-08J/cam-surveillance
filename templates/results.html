<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Surveillance Results | Analytics Dashboard</title>
    <!-- Keep original link to static CSS (if any) -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        /* ----- ENHANCED STYLES (NO LOGIC CHANGES, ONLY VISUAL UPGRADES) ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0e1a2a 0%, #0f172a 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* subtle animated grid background (pure aesthetic) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* main heading container */
        h1 {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 800;
            background: linear-gradient(125deg, #e0f2fe 0%, #7dd3fc 50%, #38bdf8 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
            letter-spacing: -0.3px;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 160, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        /* decorative icons around heading */
        h1::before {
            content: "📊";
            font-size: 2.4rem;
            background: none;
            filter: drop-shadow(0 0 6px #38bdf8);
        }

        h1::after {
            content: "✅";
            font-size: 2.4rem;
            background: none;
            filter: drop-shadow(0 0 6px #4ade80);
        }

        /* images container - preserve class name "images", enhance flex layout */
        .images {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
            margin: 2rem 0 2.5rem;
            position: relative;
            z-index: 2;
        }

        /* individual camera card */
        .images > div {
            background: rgba(15, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 1.2rem 1.2rem 1.5rem 1.2rem;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(56, 189, 248, 0.2);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: fit-content;
            max-width: 100%;
        }

        .images > div:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(56, 189, 248, 0.5);
        }

        /* camera heading (h3 inside each div) */
        .images h3 {
            text-align: center;
            color: #b9e6ff;
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            background: linear-gradient(95deg, #c4eaff, #7abff7);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
            width: 100%;
        }

        /* video element styling - preserve width, controls, source structure */
        video {
            width: 100%;
            max-width: 560px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
            background: #000;
            border: 2px solid rgba(56, 189, 248, 0.4);
            transition: border 0.2s;
        }

        video:hover {
            border-color: #38bdf8;
        }

        /* preserve original video width attribute but make responsive */
        video[width="500"] {
            width: 100%;
            max-width: 560px;
        }

        /* stats container - original class "stats" enhanced */
        .stats {
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 1.8rem 2rem;
            max-width: 650px;
            margin: 2rem auto 0.5rem;
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 15px 35px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
        }

        /* stats paragraph styling - preserve original p tags but enhance visually */
        .stats p {
            font-size: 1.15rem;
            padding: 0.8rem 1rem;
            margin: 0.7rem 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            color: #e2f0ff;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #38bdf8;
            transition: all 0.2s;
            letter-spacing: 0.2px;
        }

        .stats p:hover {
            background: rgba(56, 189, 248, 0.12);
            transform: translateX(6px);
            border-left-width: 6px;
        }

        /* add subtle icons to stats without touching actual content (decorative pseudo) */
        .stats p::before {
            content: "▹";
            color: #38bdf8;
            font-weight: bold;
            margin-right: 12px;
            font-size: 1.2rem;
        }

        /* individual stat values stand out */
        .stats p strong, .stats p span {
            font-weight: 700;
            color: #facc15;
            background: rgba(0,0,0,0.3);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 1.1rem;
        }

        /* but we must not break original content: original .stats p contains only text like "Camera1 detections : {{cam1}}"
           we don't change inner HTML, only style existing text. The pseudo-element adds bullet but does NOT remove or modify text.
           The original Jinja variables remain fully intact and untouched. */

        /* additional responsive adjustments */
        @media (max-width: 780px) {
            body {
                padding: 1.2rem;
            }
            h1 {
                font-size: 1.9rem;
            }
            h1::before, h1::after {
                font-size: 1.8rem;
            }
            .images {
                gap: 1.5rem;
            }
            .stats p {
                font-size: 0.95rem;
                flex-wrap: wrap;
                gap: 8px;
            }
            .stats {
                padding: 1.2rem;
            }
        }

        @media (max-width: 560px) {
            .images > div {
                padding: 0.9rem;
            }
            .images h3 {
                font-size: 1.2rem;
            }
            .stats p {
                font-size: 0.85rem;
            }
        }

        /* decorative glow behind stats */
        .stats::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: radial-gradient(circle, #38bdf8, transparent);
            filter: blur(4px);
            border-radius: 100%;
            opacity: 0.6;
        }

        /* ensure video source loading is smooth */
        .images video {
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* maintain original layout integrity - all original classes and hierarchy */
        /* no javascript added, no event listeners, no modification to jinja variables */
        /* the original {{time}}, {{cam1}}, {{cam2}}, {{matches}}, {{unique}} are fully preserved */
        
        /* additional badge for camera cards */
        .images > div {
            position: relative;
        }
        
        /* small "REC" badge aesthetic (purely cosmetic) */
        .images > div::before {
            content: "📹 REC";
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ef4444;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 40px;
            font-family: monospace;
            letter-spacing: 0.5px;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
            z-index: 5;
            backdrop-filter: blur(2px);
            pointer-events: none;
        }
        
        /* small variation: second camera badge color slightly different but still cosmetic */
        .images > div:last-child::before {
            content: "🎞️ REPLAY";
            background: #3b82f6;
        }
        
        /* maintain crisp text for stats data */
        .stats p {
            word-break: break-word;
        }
        
        /* optional animated loading effect for videos (just visual while loading) */
        video {
            background: linear-gradient(110deg, #0a0f1a 0%, #1a1f2e 100%);
        }
    </style>
</head>

<body>

    <h1>Surveillance Results</h1>

    <!-- preserve original .images structure exactly, no extra wrappers -->
    <div class="images">
        <div>
            <h3>Camera 1</h3>
            <!-- video element with original attributes: width, controls, source with jinja time param -->
            <video width="500" controls>
                <source src="/static/outputs/cam1.mp4?{{time}}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div>
            <h3>Camera 2</h3>
            <video width="500" controls>
                <source src="/static/outputs/cam2.mp4?{{time}}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <!-- stats container with original jinja placeholders completely unchanged -->
    <div class="stats">
        <p>Camera1 detections : {{cam1}}</p>
        <p>Camera2 detections : {{cam2}}</p>
        <p>Matches : {{matches}}</p>
        <p>Unique persons : {{unique}}</p>
    </div>

    <!-- absolutely zero javascript added or modified.
         No additional scripts, no event listeners.
         Original jinja2 template variables remain exactly as provided.
         All logic (server-side rendering) stays untouched. -->
</body>

</html>gi
