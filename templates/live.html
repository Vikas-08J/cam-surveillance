<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Live Surveillance | Real-Time Analytics</title>
    <!-- Keep original link (static/css/style.css) but also add enhanced styling that doesn't conflict -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        /* ----- ORIGINAL STYLES PRESERVED (with minor visual enhancements only) ----- */
        /* original body, .live-container, .stream, .stream img, .info-panel, 
           #results-panel, .result-stat, .loader, keyframes all kept but upgraded visually */
        
        /* preserve exact original classes + properties, then layer enhancements */
        body { 
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', sans-serif; 
            background: linear-gradient(135deg, #f0f4fa 0%, #e2e8f2 100%);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        
        /* Keep original container behavior but add responsive centering */
        .live-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        /* enhanced stream cards — keep original border+radius+background but upgrade depth */
        .stream {
            border: 2px solid #1e2f3e;
            border-radius: 20px;
            overflow: hidden;
            background: #0a0f1a;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .stream:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 40px -14px rgba(0, 0, 0, 0.45);
            border-color: #2c5a7a;
        }
        
        .stream img {
            display: block;
            width: 100%;
            max-width: 560px;
            height: auto;
            background: #000;
            transition: filter 0.2s;
        }
        
        /* original h3 style within stream - preserve alignment but modernize text */
        .stream h3 {
            text-align: center;
            color: #eef4ff;
            margin: 0;
            padding: 12px 0;
            background: linear-gradient(90deg, #142c44, #1a3a55);
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: 1.2rem;
            border-bottom: 1px solid #2d6a8f;
        }
        
        /* info-panel: keep original loader and messages, improve card style */
        .info-panel {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 36px;
            padding: 1.2rem 2rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        
        .info-panel p {
            font-size: 1rem;
            color: #1e2f3c;
            font-weight: 500;
            margin: 8px 0;
        }
        
        /* results panel - keep original display:none, border, bg, width etc but refine */
        #results-panel {
            display: none;
            margin: 30px auto;
            padding: 28px 30px;
            border: 2px solid #2e7d32;
            border-radius: 28px;
            background: linear-gradient(145deg, #ffffff, #f9fff9);
            width: 65%;
            max-width: 650px;
            text-align: left;
            box-shadow: 0 18px 32px -12px rgba(46, 125, 50, 0.25);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        
        #results-panel h2 {
            color: #1b5e20;
            margin-top: 0;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -0.3px;
            border-bottom: 2px solid #81c784;
            display: inline-block;
            width: auto;
            padding-bottom: 6px;
        }
        
        /* result-stat exact same class names, enhanced readability */
        .result-stat {
            font-size: 1.2rem;
            margin: 14px 0;
            font-weight: 600;
            padding: 6px 12px;
            background: #f8fafc;
            border-radius: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #4caf50;
        }
        
        /* keep original loader animation but make it more polished */
        .loader {
            border: 4px solid rgba(52, 152, 219, 0.2);
            border-top: 4px solid #2c7cb6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.9s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 12px;
            box-shadow: 0 0 6px rgba(52,152,219,0.3);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* additional visual touches that don't interfere with logic */
        h1 {
            text-align: center;
            font-size: 2.4rem;
            background: linear-gradient(125deg, #0f2d44, #1b4f72);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        /* subtle camera badge */
        h1::after {
            content: " 🎥";
            font-size: 2rem;
            background: none;
            color: #2c7cb6;
        }
        
        /* Responsive touches */
        @media (max-width: 780px) {
            .stream img {
                max-width: 420px;
            }
            #results-panel {
                width: 85%;
                padding: 20px;
            }
            .result-stat {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 560px) {
            .live-container {
                gap: 20px;
            }
            .stream img {
                max-width: 100%;
            }
            h1 {
                font-size: 1.7rem;
            }
        }
        
        /* keep original loader / waiting panel consistent but more visible */
        .info-panel .loader {
            border-top-color: #1e6f9f;
        }
        
        /* ensure results panel hr style consistent */
        #results-panel hr {
            margin: 18px 0;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, #66bb6a, transparent);
        }
        
        /* make stat with matches pop slightly */
        .result-stat:has(> :contains("Matches Found")) {
            background: #fff0f0;
            border-left-color: #d9534f;
        }
        
        /* but since :contains not fully standard, we just style via inline style OR add extra safety 
           but we never change dynamic content generation — we preserve original innerHTML exactly as script sets.
           So we add a general class for matches if needed via script? no — but we add style for any .result-stat 
           that includes matches text using attribute? not needed: Original script sets style color:#d9534f inline.
           we respect that, just make it more polished */
        
        /* extra flair for unique total */
        .result-stat:last-of-type {
            background: #e3f2fd;
            border-left-color: #0275d8;
            font-size: 1.3rem;
        }
        
        /* ensure no logic breaking: all fetch, polling, display logic identical */
        
        /* small improvement for video feed containers loading state */
        .stream {
            position: relative;
        }
        
        .stream::before {
            content: "LIVE";
            position: absolute;
            top: 12px;
            left: 16px;
            background: #e63946;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 40px;
            z-index: 2;
            font-family: monospace;
            letter-spacing: 1px;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            pointer-events: none;
        }
    </style>
</head>

<body>

    <h1>Live Video Surveillance Feed</h1>

    <div class="live-container">
        <div class="stream">
            <h3>Camera 1 - Feed</h3>
            <img src="/video_feed/1" alt="Camera 1 Live Feed">
        </div>

        <div class="stream">
            <h3>Camera 2 - Feed</h3>
            <img src="/video_feed/2" alt="Camera 2 Live Feed">
        </div>
    </div>

    <div class="info-panel" id="waiting-panel">
        <p><span class="loader"></span> The engine is running sequentially (Camera 1 entirely, then Camera 2).</p>
        <p>Once matching is finished, the final results will appear here automatically.</p>
    </div>

    <div id="results-panel">
        <!-- Results injected here -->
    </div>

    <script>
        // ============================================================
        // ORIGINAL JAVASCRIPT LOGIC PRESERVED EXACTLY
        // No changes to checkStatus, fetch, polling, or DOM manipulations
        // Only preserved and wrapped to ensure identical behavior
        // ============================================================
        function checkStatus() {
            fetch('/status')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'done') {
                    // Hide waiting panel and video streams (or leave streams frozen)
                    document.getElementById('waiting-panel').style.display = 'none';
                    
                    // Show results dynamically
                    const panel = document.getElementById('results-panel');
                    panel.innerHTML = `
                        <h2>Matching Results</h2>
                        <div class="result-stat">Camera 1 Unique Persons : ${data.cam1}</div>
                        <div class="result-stat">Camera 2 Unique Persons : ${data.cam2}</div>
                        <div class="result-stat" style="color:#d9534f;">Matches Found : ${data.matches}</div>
                        <hr>
                        <div class="result-stat" style="color:#0275d8; font-size: 22px;">Total Unique People across both : ${data.unique}</div>
                    `;
                    panel.style.display = 'block';
                } else {
                    // Check again in 2 seconds
                    setTimeout(checkStatus, 2000);
                }
            })
            .catch(error => {
                console.error('Error fetching status:', error);
                setTimeout(checkStatus, 2000);
            });
        }
        
        // Start polling
        setTimeout(checkStatus, 2000);
    </script>
</body>

</html>
